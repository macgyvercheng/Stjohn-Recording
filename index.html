<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StJohn Recording</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#183153;margin:0;padding:16px}.c{max-width:650px;margin:auto;background:#fff;padding:20px;border-radius:18px}select,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:12px;border:1px solid #d7deea;font-size:17px}button{background:#3478f6;color:#fff;border:0;font-weight:700}.sec{background:#edf3ff;color:#2861c9}.box{background:#f6f8fc;padding:15px;border-radius:14px;margin-top:14px}.muted{color:#667085}.page{width:100%;border-radius:10px;margin-top:10px}audio{width:100%;margin-top:10px}</style><script src="config.js"></script></head><body><div class=c><h1>🎙️ StJohn錄音作業</h1><div id=msg class=muted>Loading…</div><label>班級 / Class</label><select id=cls></select><label>學生 / Student</label><select id=student></select><label>作業 / Assignment</label><select id=assignment></select><div id=work></div></div><script>
const $=id=>document.getElementById(id);
function nonce(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+nonce(),s=document.createElement('script');
  const timer=setTimeout(()=>{delete window[cb];s.remove();reject(new Error('讀取逾時 / Request timeout'));},15000);
  window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();resolve(d)};
  s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error('無法連線後端 / Backend connection failed'))};
  s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb})+'&_='+Date.now();document.head.appendChild(s);
 });
}
async function postConfirmed(data,onStatus){
 const n=nonce(); data.nonce=n;
 onStatus&&onStatus('上傳中… / Uploading…');
 try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});}catch(e){}
 for(let i=0;i<12;i++){
  await new Promise(r=>setTimeout(r,800));
  try{const x=await jsonp({api:'confirm',nonce:n});if(!x.pending){if(x.ok)return x;throw new Error(x.error||'Operation failed');}}catch(e){if(i===11)throw e;}
 }
 throw new Error('後端尚未確認，請檢查 Sheet 後再重試 / Confirmation timeout');
}
function bestMime(){if(!window.MediaRecorder)return'';for(const m of['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])if(MediaRecorder.isTypeSupported(m))return m;return''}
function to64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}

let D={},recorder,chunks=[],blob,start,tick,duration=0;const say=x=>$('msg').textContent=x;
(async()=>{if(API_URL.startsWith('PASTE_'))return say('請先設定 config.js');try{D=await jsonp({api:'bootstrap'});$('cls').innerHTML=D.classes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('cls').onchange=refresh;$('assignment').onchange=render;refresh();say('就緒 / Ready')}catch(e){say(e.message)}})();
function refresh(){const c=$('cls').value;$('student').innerHTML=D.students.filter(x=>x.classId===c).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('assignment').innerHTML=D.assignments.filter(x=>x.classId===c&&x.published).map(x=>`<option value="${x.id}">${x.week} ${x.title}</option>`).join('');render()}
async function render(){const id=$('assignment').value;if(!id){$('work').innerHTML='<div class=box>目前沒有已發布作業 / No published assignment.</div>';return}try{const d=await jsonp({api:'assignment',assignmentId:id}),a=d.assignment,imgs=d.media.filter(x=>x.type==='image').sort((a,b)=>a.sort-b),demo=d.media.filter(x=>x.type==='demo').slice(-1)[0];$('work').innerHTML=`<div class=box><h2>${a.title}</h2><div style="white-space:pre-line">${a.instructions}</div>${imgs.map(x=>`<img class=page src="${x.url}">`).join('')}${demo?`<h3>老師示範 / Teacher Demo</h3><audio controls src="${demo.url}"></audio>`:''}<h3>我的錄音 / My Recording</h3><button id=rec onclick=record()>🎤 開始錄音 / Start Recording</button><div id=timer class=muted></div><audio id=preview controls style="display:none"></audio><button id=redo class=sec style="display:none" onclick=record()>重新錄音 / Record Again</button><button id=submit style="display:none" onclick=submitR()>繳交 / Submit</button><div id=status></div></div>`}catch(e){say(e.message)}}
async function record(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const m=bestMime();recorder=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{duration=Math.max(1,Math.round((Date.now()-start)/1000));blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('preview').src=URL.createObjectURL(blob);$('preview').style.display='block';$('redo').style.display='block';$('submit').style.display='block';$('rec').textContent='🎤 再錄一次 / Record Again';clearInterval(tick);stream.getTracks().forEach(t=>t.stop())};recorder.start(250);start=Date.now();$('rec').textContent='⏹ 停止 / Stop';tick=setInterval(()=>$('timer').textContent=Math.floor((Date.now()-start)/1000)+' sec',500)}catch(e){$('status').textContent='❌ Microphone: '+e.message}}
async function submitR(){try{if(!blob)throw Error('No recording');$('submit').disabled=true;await postConfirmed({action:'submitRecording',assignmentId:$('assignment').value,studentId:$('student').value,mimeType:blob.type,durationSec:duration,base64:await to64(blob)},x=>$('status').textContent=x);$('submit').textContent='✅ 已繳交 / Submitted';$('status').textContent='作業已成功繳交 / Submission confirmed'}catch(e){$('submit').disabled=false;$('status').textContent='❌ '+e.message}}
</script></body></html>
