<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StJohn Teacher Login</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#183153;margin:0;padding:16px}.c{max-width:760px;margin:auto;background:white;padding:20px;border-radius:18px}label{display:block;font-weight:700;margin-top:12px}select,input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border-radius:12px;border:1px solid #d8e0ec;font-size:16px}button{background:#3478f6;color:white;border:0;font-weight:700}.sec{background:#edf3ff;color:#2861c9}.box{border:1px solid #dde5f0;border-radius:12px;padding:12px;margin-top:10px}.muted{color:#667085}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}audio{width:100%;margin-top:8px}.login{max-width:440px;margin:8vh auto}.badge{background:#edf3ff;padding:6px 10px;border-radius:999px;display:inline-block}</style>
<script src="config.js"></script></head><body>
<div id=login class="c login"><h1>🎙️ StJohn</h1><h2>老師登入 / Teacher Login</h2>
<label>帳號 / Account</label><select id=loginWho><option value=T001>Mafu</option><option value=T002>Vee</option><option value=ADMIN>管理員 / Administrator</option></select>
<label>密碼 / Password</label><input id=loginPw type=password inputmode=numeric autocomplete=current-password>
<button id=loginBtn onclick=loginNow()>登入 / Sign In</button><div id=loginMsg class=muted></div></div>
<div id=portal class=c style="display:none"><h1>🎙 StJohn V2.6 | Teacher Portal</h1>
<div><span id=who class=badge></span> <button class=sec style="width:auto;padding:7px 12px" onclick=logout()>登出 / Sign Out</button></div><div id=msg class=muted></div>
<div class=row><div><label>老師 / Teacher</label><select id=teacher disabled></select></div><div><label>班級 / Class</label><select id=cls></select></div></div>
<label>週次 / Week</label><input id=week placeholder="Week 1"><label>作業標題 / Assignment Title</label><input id=title><label>作業說明 / Instructions</label><textarea id=ins rows=4></textarea><label>截止日期 / Due Date</label><input id=due type=date>
<button onclick=createA()>建立作業 / Create Assignment</button>
<div id=materials style="display:none"><div class=box><b id=aid></b><label>課文照片 / Reading Images</label><input id=photo type=file accept="image/*"><button id=photoBtn class=sec onclick=upPhoto()>📷 上傳照片 / Upload Image</button><div id=photoStatus class=muted></div>
<label>老師示範 / Teacher Demo</label><button id=rec onclick=record()>🎤 開始錄音 / Start Recording</button><div id=timer class=muted></div><audio id=preview controls style="display:none"></audio><button id=updemo class=sec style="display:none" onclick=upDemo()>☁️ 上傳示範 / Upload Demo</button><div id=demoStatus class=muted></div><button onclick=publishA()>✅ 發布作業 / Publish</button></div></div>
<h2>作業 / Assignments</h2><div id=list></div></div>
<script>const $=id=>document.getElementById(id);
function nonce(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+nonce(),s=document.createElement('script');
  const timer=setTimeout(()=>{delete window[cb];s.remove();reject(new Error('讀取逾時 / Request timeout'));},15000);
  window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();resolve(d)};
  s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error('無法連線後端 / Backend connection failed'))};
  s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb})+'&_='+Date.now();document.head.appendChild(s);
 });
}
async function postConfirmed(data,onStatus){
 const n=nonce(); data.nonce=n;
 onStatus&&onStatus('上傳中… / Uploading…');
 try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});}catch(e){}
 for(let i=0;i<12;i++){
  await new Promise(r=>setTimeout(r,800));
  try{const x=await jsonp({api:'confirm',nonce:n});if(!x.pending){if(x.ok)return x;throw new Error(x.error||'Operation failed');}}catch(e){if(i===11)throw e;}
 }
 throw new Error('後端尚未確認，請檢查 Sheet 後再重試 / Confirmation timeout');
}
function bestMime(){if(!window.MediaRecorder)return'';for(const m of['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])if(MediaRecorder.isTypeSupported(m))return m;return''}
function to64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}


let D={},aid='',recorder,chunks=[],blob,start,tick,AUTH='',SESSION=null;
const say=x=>$('msg').textContent=x;
async function loginNow(){const bt=$('loginBtn');try{bt.disabled=true;$('loginMsg').textContent='⏳ 登入中… / Signing in…';const r=await postConfirmed({action:'login',teacherId:$('loginWho').value,password:$('loginPw').value},x=>$('loginMsg').textContent=x);AUTH=r.token;SESSION=r.session;sessionStorage.setItem('stjohn_auth',AUTH);await enterPortal()}catch(e){$('loginMsg').textContent='❌ '+e.message}finally{bt.disabled=false}}
async function enterPortal(){D=await jsonp({api:'bootstrap'});$('login').style.display='none';$('portal').style.display='block';$('who').textContent=(SESSION.role==='admin'?'管理員 / Administrator':SESSION.name);
 if(SESSION.role==='admin'){$('teacher').disabled=false;$('teacher').innerHTML=D.teachers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
 else{$('teacher').disabled=true;$('teacher').innerHTML=`<option value="${SESSION.teacherId}">${SESSION.name}</option>`}
 $('teacher').onchange=classes;classes();renderList();say('就緒 / Ready')}
async function restore(){const t=sessionStorage.getItem('stjohn_auth');if(!t)return;try{const r=await jsonp({api:'authCheck',token:t});if(r.ok){AUTH=t;SESSION=r.session;await enterPortal()}}catch(e){}}
function logout(){sessionStorage.removeItem('stjohn_auth');location.reload()}
function classes(){let cs=D.classes;if(SESSION&&SESSION.role!=='admin')cs=cs.filter(c=>SESSION.classes.includes(c.id));else cs=cs.filter(c=>c.teacherIds.includes($('teacher').value));$('cls').innerHTML=cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
async function createA(){try{if(!$('teacher').value||!$('cls').value||!$('title').value.trim())throw Error('請填老師、班級、標題 / Teacher, class and title required');aid=$('cls').value+'-'+Date.now();await postConfirmed({action:'createAssignment',token:AUTH,assignmentId:aid,teacherId:$('teacher').value,classId:$('cls').value,week:$('week').value,title:$('title').value.trim(),instructions:$('ins').value,dueDate:$('due').value},say);$('aid').textContent='Assignment ID: '+aid;$('materials').style.display='block';say('✅ 作業已建立 / Created')}catch(e){say('❌ '+e.message)}}
async function upPhoto(){const st=$('photoStatus'),bt=$('photoBtn');try{const f=$('photo').files[0];if(!aid||!f)throw Error('請先建立作業並選照片');bt.disabled=true;st.textContent='⏳ 上傳中… / Uploading…';await postConfirmed({action:'uploadMedia',token:AUTH,assignmentId:aid,mediaType:'image',mimeType:f.type||'image/jpeg',base64:await to64(f)},x=>st.textContent=x);st.textContent='✅ 已上傳 / Uploaded'}catch(e){st.textContent='❌ '+e.message}finally{bt.disabled=false}}
async function record(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const m=bestMime();recorder=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('preview').src=URL.createObjectURL(blob);$('preview').style.display='block';$('updemo').style.display='block';$('rec').textContent='🎤 重新錄音 / Record Again';clearInterval(tick);stream.getTracks().forEach(t=>t.stop())};recorder.start(250);start=Date.now();$('rec').textContent='⏹ 停止 / Stop';tick=setInterval(()=>$('timer').textContent=Math.floor((Date.now()-start)/1000)+' sec',500)}catch(e){say('❌ Microphone: '+e.message)}}
async function upDemo(){const st=$('demoStatus'),bt=$('updemo');try{if(!blob)throw Error('No recording');bt.disabled=true;st.textContent='⏳ 上傳中… / Uploading…';await postConfirmed({action:'uploadMedia',token:AUTH,assignmentId:aid,mediaType:'demo',mimeType:blob.type,base64:await to64(blob)},x=>st.textContent=x);st.textContent='✅ 示範已上傳 / Demo uploaded'}catch(e){st.textContent='❌ '+e.message}finally{bt.disabled=false}}
async function publishA(){try{await postConfirmed({action:'publish',token:AUTH,assignmentId:aid},say);say('✅ 已發布 / Published');setTimeout(()=>location.reload(),700)}catch(e){say('❌ '+e.message)}}
function renderList(){let arr=D.assignments;if(SESSION.role!=='admin')arr=arr.filter(a=>SESSION.classes.includes(a.classId));$('list').innerHTML=arr.slice().reverse().map(a=>`<div class=box><b>${a.classId} | ${a.week} | ${a.title}</b><div>${a.published?'Published':'Draft'}</div><button class=sec onclick="subs('${a.id}')">查看繳交 / Submissions</button>${SESSION.role==='admin'?`<button style="background:#b42318" onclick="deleteA('${a.id}',${JSON.stringify(a.title)})">🗑 刪除作業 / Delete Assignment</button><div id="del_${a.id}" class="muted"></div>`:''}<div id="s_${a.id}"></div></div>`).join('')}
async function subs(id){try{const d=await jsonp({api:'teacherSubmissions',assignmentId:id});$('s_'+id).innerHTML=d.rows.map(r=>`<div class=box><b>${r.name}</b> ${r.submission?`<a target=_blank href="${r.submission.audioUrl}">▶ Play</a><select id="st_${r.studentId}"><option>待批改</option><option>完成</option><option>重新錄</option></select><input id="co_${r.studentId}" value="${r.submission.comment||''}" placeholder="Teacher comment"><button id="rvb_${r.studentId}" onclick="review('${id}','${r.studentId}')">Save</button><div id="rvs_${r.studentId}" class="muted"></div>`:'❌ Not Submitted'}</div>`).join('')}catch(e){say(e.message)}}
async function review(a,s){const st=$('rvs_'+s),bt=$('rvb_'+s);try{bt.disabled=true;st.textContent='⏳ 儲存中… / Saving…';await postConfirmed({action:'review',token:AUTH,assignmentId:a,studentId:s,status:$('st_'+s).value,comment:$('co_'+s).value},x=>st.textContent=x);st.textContent='✅ 評語已儲存 / Feedback Saved'}catch(e){st.textContent='❌ '+e.message}finally{bt.disabled=false}}
async function deleteA(id,title){
 if(!SESSION||SESSION.role!=='admin')return;
 const ok=confirm(`⚠️ 確定刪除「${title}」？\n\n將刪除這份作業、教材資料、學生繳交紀錄，相關 Drive 檔案會移到垃圾桶。\n\nDelete this assignment and related files/submissions?`);
 if(!ok)return;
 const st=$('del_'+id);
 try{
   st.textContent='⏳ 刪除中… / Deleting…';
   await postConfirmed({action:'deleteAssignment',token:AUTH,assignmentId:id},x=>st.textContent=x);
   st.textContent='✅ 已刪除 / Deleted';
   D.assignments=D.assignments.filter(a=>a.id!==id);
   setTimeout(renderList,600);
 }catch(e){st.textContent='❌ '+e.message}
}
restore();
</script></body></html>
