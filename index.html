<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StJohn 錄音作業</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#183153;margin:0;padding:16px}
.c{max-width:760px;margin:auto;background:#fff;padding:20px;border-radius:18px}
.login{max-width:480px;margin:8vh auto}
h1{margin-top:0} label{display:block;font-weight:700;margin-top:14px}
select,input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border-radius:12px;border:1px solid #d8e0ec;font-size:16px}
button{background:#3478f6;color:#fff;border:0;font-weight:700}.sec{background:#edf3ff;color:#2861c9}
.box{border:1px solid #dde5f0;border-radius:14px;padding:14px;margin-top:12px}.muted{color:#667085}.badge{background:#edf3ff;padding:6px 10px;border-radius:999px;display:inline-block}
img{max-width:100%;border-radius:10px;margin-top:8px}audio{width:100%;margin-top:8px}.feedback{background:#fff8e6;border:1px solid #f2d58a;border-radius:14px;padding:14px;margin:12px 0}
.brand{text-align:center;margin-bottom:18px}.brand-logo{width:min(100%,420px);height:auto;display:block;margin:0 auto 8px}.mascot{width:105px;height:auto;display:block;margin:0 auto 8px}.welcome{text-align:center;margin:2px 0 14px}.welcome h2{margin:4px 0}.welcome .muted{font-size:14px}
#pick{position:relative;overflow:hidden}#pick:after{content:"";position:absolute;right:-28px;bottom:-24px;width:145px;height:145px;background:url('stjohn-mascot.jpg') center/contain no-repeat;opacity:.08;pointer-events:none}
.student-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #e7edf6}.student-head img{width:76px;margin:0}.student-head .title{font-size:22px;font-weight:800}.assignment-title{display:flex;align-items:center;gap:8px}.assignment-title:before{content:"📘"}
</style><script src="config.js"></script></head><body>
<div id=pick class="c login"><div class=brand><img class=brand-logo src="stjohn-logo.jpg" alt="St. John American School"></div><div class=welcome><h2>🎙️ 錄音作業 / Recording Homework</h2><div class=muted>學生登入 / Student Login</div></div>
<label>班級 / Class</label><select id=cls onchange=students()></select>
<label>姓名 / Name</label><select id=student></select>
<button onclick=enter()>進入作業 / Enter Assignments</button><div id=pickMsg class=muted></div></div>

<div id=home class=c style="display:none">
<div class=student-head><img src="stjohn-mascot.jpg" alt=""><div><div class=title>StJohn 錄音作業</div><div class=muted>Recording Homework</div></div></div>
<div><span id=who class=badge></span> <button class=sec style="width:auto;padding:7px 12px" onclick=back()>更換學生 / Change Student</button></div>
<div id=feedback></div>
<h2>作業清單 / Assignments</h2><div id=list></div>
<div id=detail style="display:none"></div>
</div>

<script>
const $=id=>document.getElementById(id); let D={},ME=null,mediaCache={};
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();d&&d.ok===false?reject(Error(d.error||'Error')):resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(Error('Network error'))};params.callback=cb;s.src=API_URL+'?'+new URLSearchParams(params);document.body.appendChild(s)})}
async function init(){try{D=await jsonp({api:'bootstrap'});$('cls').innerHTML=D.classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');students()}catch(e){$('pickMsg').textContent='❌ '+e.message}}
function students(){const c=$('cls').value;$('student').innerHTML=D.students.filter(s=>s.classId===c).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
async function enter(){const id=$('student').value;ME=D.students.find(s=>s.id===id);if(!ME)return;$('pick').style.display='none';$('home').style.display='block';$('who').textContent=ME.classId+' | '+ME.name;await loadFeedback();renderList()}
function back(){ME=null;$('home').style.display='none';$('detail').style.display='none';$('pick').style.display='block'}
async function loadFeedback(){const box=$('feedback');try{const r=await jsonp({api:'studentFeedback',studentId:ME.id,assignmentId:''});if(r.feedback){const f=r.feedback;box.innerHTML=`<div class=feedback><b>📝 上次老師的評語 / Previous Teacher Feedback</b><div style="margin-top:8px">${f.week?f.week+' | ':''}${f.title||''}</div><div><b>${f.status||''}</b></div><div style="margin-top:6px">${f.comment||''}</div></div>`}else box.innerHTML=''}catch(e){box.innerHTML=''}}
function renderList(){const arr=D.assignments.filter(a=>a.classId===ME.classId&&a.published);$('list').innerHTML=arr.length?arr.slice().reverse().map(a=>`<div class=box><b class=assignment-title>${fmtDate(a.week)} | ${a.title}</b><div class=muted>${a.instructions||''}</div><button class=sec onclick="openA('${a.id}')">查看作業 / Open Assignment</button></div>`).join(''):'<div class=muted>目前沒有作業 / No assignments yet.</div>'}
function fmtDate(v){if(!v)return'';const d=new Date(v);if(!isNaN(d))return d.toLocaleDateString('zh-TW');return v}
async function openA(id){const a=D.assignments.find(x=>x.id===id),box=$('detail');box.style.display='block';box.innerHTML='<div class=box>⏳ 載入作業… / Loading…</div>';try{const r=await jsonp({api:'assignment',assignmentId:id});let media='';for(const m of (r.media||[])){if(m.mediaType==='image')media+=`<div id="m_${m.fileId}">⏳ Loading image…</div>`;if(m.mediaType==='demo')media+=`<div id="m_${m.fileId}">⏳ Loading demo…</div>`}box.innerHTML=`<div class=box><button class=sec onclick="closeA()">← 返回作業清單 / Back</button><h2>${a.title}</h2><div>${a.instructions||''}</div>${media}<hr><b>學生錄音 / Student Recording</b><button id=rec onclick="record()">🎤 開始錄音 / Start Recording</button><div id=timer class=muted></div><audio id=preview controls style="display:none"></audio><button id=submit style="display:none" onclick="submitRec('${id}')">☁️ 繳交錄音 / Submit Recording</button><div id=submitStatus class=muted></div></div>`;for(const m of (r.media||[]))loadMedia(m)}catch(e){box.innerHTML='<div class=box>❌ '+e.message+'</div>'}box.scrollIntoView({behavior:'smooth'})}
function closeA(){$('detail').style.display='none';$('detail').innerHTML='';$('list').scrollIntoView({behavior:'smooth'})}
async function loadMedia(m){try{const d=await jsonp({api:'media',fileId:m.fileId}),src='data:'+(d.mimeType||'application/octet-stream')+';base64,'+d.base64,el=$('m_'+m.fileId);if(m.mediaType==='image')el.innerHTML=`<img src="${src}">`;else el.innerHTML=`<div><b>🔊 老師示範 / Teacher Demo</b><audio controls src="${src}"></audio></div>`}catch(e){const el=$('m_'+m.fileId);if(el)el.textContent='❌ Media error'}}
let recorder,chunks=[],blob,start,tick;
function bestMime(){const a=['audio/mp4','audio/webm;codecs=opus','audio/webm'];return a.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||''}
async function record(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const m=bestMime();recorder=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('preview').src=URL.createObjectURL(blob);$('preview').style.display='block';$('submit').style.display='block';$('rec').textContent='🎤 重新錄音 / Record Again';clearInterval(tick);stream.getTracks().forEach(t=>t.stop())};recorder.start(250);start=Date.now();$('rec').textContent='⏹ 停止 / Stop';tick=setInterval(()=>$('timer').textContent=Math.floor((Date.now()-start)/1000)+' sec',500)}catch(e){$('submitStatus').textContent='❌ '+e.message}}
function to64(b){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
function postConfirmed(data,status){return new Promise(async(resolve,reject)=>{try{const nonce='n'+Date.now()+Math.random().toString(36).slice(2);data.nonce=nonce;const f=document.createElement('iframe');f.name='p_'+nonce;f.style.display='none';document.body.appendChild(f);const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=f.name;form.style.display='none';Object.entries(data).forEach(([k,v])=>{const i=document.createElement('input');i.name=k;i.value=v??'';form.appendChild(i)});document.body.appendChild(form);form.submit();let tries=0;const poll=async()=>{tries++;try{const r=await jsonp({api:'confirm',nonce});if(r&&r.ok){form.remove();f.remove();resolve(r);return}}catch(e){}if(tries<45){status&&status('⏳ 上傳中… / Uploading…');setTimeout(poll,1000)}else{form.remove();f.remove();reject(Error('Upload confirmation timeout'))}};setTimeout(poll,1000)}catch(e){reject(e)}})}
async function submitRec(id){const st=$('submitStatus'),bt=$('submit');try{if(!blob)throw Error('No recording');bt.disabled=true;st.textContent='⏳ 繳交中… / Submitting…';await postConfirmed({action:'submitRecording',assignmentId:id,classId:ME.classId,studentId:ME.id,studentName:ME.name,mimeType:blob.type,base64:await to64(blob)},x=>st.textContent=x);st.textContent='✅ 已繳交 / Submitted'}catch(e){st.textContent='❌ '+e.message}finally{bt.disabled=false}}
init();
</script></body></html>
